inputs: 

#select the mode of running hmmsearch

  mode: 
    input: "jackhmmer"    #manual | jackhmmer | pfam

  pfam:
    hmm_db: "/home/bhatn/asgard_pipeline/database/pfam/Pfam-A.hmm"
