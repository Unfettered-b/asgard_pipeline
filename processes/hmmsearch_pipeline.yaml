    AsCOGs: "/home/bhatn/asgard_pipeline/database/COG/AsCOGs/ali.8/"
    ascogs_tsv: "/home/bhatn/asgard_pipeline/database/COG/AsCOGs/asCOGs.2020-10.def.tab"
    uniprot_db: "/home/bhatn/syn_cell_bio/uniprot/uniprot_sprot.fasta"

