---
run:
  
  pipeline: hmmsearch_pipeline
  id: ftsz_other_archaea
  protein_name: ftsz
  base_dir: "/mnt/Lab_work/sp_lab/asgard_pipeline"
  env_dir: "{base_dir}/bin/envs"
  log_dir: "{base_dir}/logs/pipeline_logs/"
  reason: to test for ftsz sequences in archaeal proteins
  cores: 24

inputs: 

#select the mode of running hmmsearch

  mode: "pfam"    #manual | jackhmmer | pfam

  pfam:
    hmm_db: "{base_dir}/database/pfam/Pfam-A.hmm"
    names:
    ids:
     - PF00091

  manual:
    msa: ""  #give path to msa file
  

  jackhmmer:
    params:
      accession_id: P63261
      incE: 10e-5
      evalue_cutoff: 10e-5
      iterations: 3

  database:
    fasta: "{base_dir}/database/other_sequences/nitrososphaeria_ftsz_ncbi.fasta"
    fna: "{base_dir}/database/other_organisms/pullulans/GCF_000721785.1_Aureobasidium_pullulans_var._pullulans_EXF-150_assembly_version_1.0_genomic.fna"
    gbff: "{base_dir}/database/other_organisms/pullulans/GCF_000721785.1_Aureobasidium_pullulans_var._pullulans_EXF-150_assembly_version_1.0_genomic.gbff"
    AsCOGs: "{base_dir}/database/COG/AsCOGs/ali.8/"
    AsCOGs_dir: "{base_dir}/database/COG/AsCOGs"
    ascogs_tsv: "{base_dir}/database/COG/AsCOGs/asCOGs.2020-10.def.tab"
    uniprot_db: "{base_dir}/database/uniprot_sprot.fasta"

params:
  get_flanks: false
  evalue: 1e-5
  cpus: 16

